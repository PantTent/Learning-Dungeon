# Builds the Android app (APK) on every push to main and publishes it to the
# "Android app (latest)" release, so it can be downloaded on the tablet from:
# https://github.com/PantTent/Learning-Dungeon/releases/download/android-latest/LearningDungeon.apk
# Every build is signed with the same sideload key (android/sideload.keystore)
# and gets a higher version number, so a new APK installs over the old one and
# keeps the saved games.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../LearningDungeon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: learning-dungeon-apk
          path: LearningDungeon.apk
      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest LearningDungeon.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Android app (latest)" \
            --notes "Newest build of the Learning Dungeon app (version 1.0.${{ github.run_number }}). On the Android tablet: download LearningDungeon.apk, open it, and allow installing from this source if asked. Installing a newer one keeps the saved games."
