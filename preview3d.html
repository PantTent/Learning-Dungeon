<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Learning Dungeon - 3D Preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd8ff; font-family: "Trebuchet MS", Roboto, sans-serif; touch-action: none; }
      #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; background: linear-gradient(transparent, rgba(0,0,0,0.55)); }
      #ui .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
      button { font: inherit; font-size: 15px; color: #fff; border: 2px solid rgba(255,255,255,0.35); border-radius: 10px; padding: 8px 12px; background: #4b3a78; box-shadow: 0 3px 0 rgba(0,0,0,0.35); }
      button.on { outline: 3px solid #ffd24a; }
      button.r-common { background: #6b6b6b; } button.r-uncommon { background: #2f8a3a; } button.r-rare { background: #2a62c0; }
      button.r-epic { background: #7a3ac0; } button.r-legendary { background: #c07010; }
      button.attack { background: #c03a3a; font-size: 18px; padding: 10px 22px; }
      #title { position: fixed; top: 10px; left: 0; right: 0; text-align: center; color: #fff; font-size: 20px; text-shadow: 0 2px 0 #000, 0 0 6px #000; pointer-events: none; }
      .dmg { position: fixed; font-weight: bold; font-size: 34px; color: #fff; text-shadow: 0 3px 0 #000, 0 0 8px #000; pointer-events: none; transition: transform 0.8s ease-out, opacity 0.8s; }
    </style>
  </head>
  <body>
    <div id="title">3D look preview - tap the buttons to change class and gear</div>
    <div id="ui"></div>
    <script type="module" src="/src/preview3d/main.ts"></script>
  </body>
</html>
